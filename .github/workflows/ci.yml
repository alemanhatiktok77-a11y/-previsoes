name: BOT TRADER AI CI
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: bot, POSTGRES_PASSWORD: bot, POSTGRES_DB: bot}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bot" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults: {run: {working-directory: backend}}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.12'}
    - run: pip install -r requirements-dev.txt
    - name: Testes (unitários + integração com PostgreSQL e Redis)
      env:
        TEST_DATABASE_URL: postgresql://bot:bot@localhost:5432/bot
        TEST_REDIS_URL: redis://localhost:6379/0
      run: python -m pytest -v -rs 2>&1 | tee ../backend-tests.log; exit ${PIPESTATUS[0]}
    - name: Build da imagem Docker
      run: docker build -t bot-trader-ai-api . 2>&1 | tail -20
    - name: Publicar relatório de testes
      if: always()
      working-directory: .
      env: {GH_TOKEN: '${{ github.token }}'}
      run: |
        gh release delete bot-ci-backend -y --cleanup-tag || true
        tail -c 60000 backend-tests.log > notes.txt || echo "sem log" > notes.txt
        gh release create bot-ci-backend --target "$GITHUB_SHA" --title "CI backend ($GITHUB_SHA)" --notes-file notes.txt --prerelease

  android:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: {distribution: temurin, java-version: '17'}
    - uses: gradle/actions/setup-gradle@v4
      with: {gradle-version: '8.7'}
    - name: Testes unitários + compilação do APK
      run: gradle -p android testDebugUnitTest assembleDebug --no-daemon --console=plain 2>&1 | tee android-build.log; exit ${PIPESTATUS[0]}
    - name: Publicar APK
      env: {GH_TOKEN: '${{ github.token }}'}
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk BotTraderAI.apk
        gh release delete bot-trader-ai-latest -y --cleanup-tag || true
        gh release create bot-trader-ai-latest BotTraderAI.apk --target "$GITHUB_SHA" --title "BOT TRADER AI (última versão)" --notes "APK do app Android. O app precisa do servidor (pasta backend) rodando."
    - name: Publicar log de erro
      if: failure()
      env: {GH_TOKEN: '${{ github.token }}'}
      run: |
        (grep -E "^e: |error:|FAILED|What went wrong|Could not|Unresolved|Exception" -A3 android-build.log | head -c 40000; echo; echo ----; tail -c 15000 android-build.log) > notes.txt
        gh release delete bot-ci-android -y --cleanup-tag || true
        gh release create bot-ci-android --target "$GITHUB_SHA" --title "CI android falhou" --notes-file notes.txt --prerelease
