name: Gerar APK TV Livre BR
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: {distribution: temurin, java-version: '17'}
    - uses: gradle/actions/setup-gradle@v4
      with: {gradle-version: '8.7'}
    - run: gradle assembleDebug --no-daemon --stacktrace
    - run: cp app/build/outputs/apk/debug/app-debug.apk TVLivreBR.apk
    - uses: actions/upload-artifact@v4
      with: {name: TVLivreBR-APK, path: TVLivreBR.apk}
    - name: Publicar link de download
      env: {GH_TOKEN: '${{ github.token }}'}
      run: |
        gh release delete iptv-latest -y --cleanup-tag || true
        gh release create iptv-latest TVLivreBR.apk --target "$GITHUB_SHA" --title "TV Livre BR (última versão)" --notes "Baixe o TVLivreBR.apk e instale no Android (celular, TV Box ou Android TV)."
