name: Gerar APK SinaisPro
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: {distribution: temurin, java-version: '17'}
    - uses: gradle/actions/setup-gradle@v4
      with: {gradle-version: '8.7'}
    - run: gradle assembleDebug --no-daemon
    - run: cp app/build/outputs/apk/debug/app-debug.apk SinaisPro.apk
    - uses: actions/upload-artifact@v4
      with: {name: SinaisPro-APK, path: SinaisPro.apk}
    - name: Publicar link de download
      env: {GH_TOKEN: '${{ github.token }}'}
      run: |
        gh release delete sinaispro-latest -y --cleanup-tag || true
        gh release create sinaispro-latest SinaisPro.apk --target "$GITHUB_SHA" --title "SinaisPro (última versão)" --notes "Baixe o SinaisPro.apk e instale no Android."
