name: Gerar APK RoletaStats
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: {distribution: temurin, java-version: '17'}
    - uses: gradle/actions/setup-gradle@v4
      with: {gradle-version: '8.7'}
    - run: gradle assembleDebug --no-daemon
    - run: cp app/build/outputs/apk/debug/app-debug.apk RoletaStats.apk
    - uses: actions/upload-artifact@v4
      with: {name: RoletaStats-APK, path: RoletaStats.apk}
    - name: Publicar link de download
      env: {GH_TOKEN: '${{ github.token }}'}
      run: |
        gh release delete roleta-latest -y --cleanup-tag || true
        gh release create roleta-latest RoletaStats.apk --target "$GITHUB_SHA" --title "RoletaStats (última versão)" --notes "Baixe o RoletaStats.apk e instale no Android."
