# BOT TRADER AI — servidor completo: API + PostgreSQL + Redis + HTTPS (Caddy)
# Uso: copie .env.example para .env, preencha e rode:  docker compose up -d --build
services:
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bot:${POSTGRES_PASSWORD}@db:5432/bot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped
    expose: ["8000"]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bot
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["443:443", "80:80"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddydata:
